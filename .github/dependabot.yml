version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 5
    groups:
      minor-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 5
    groups:
      minor-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 5
    groups:
      minor-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
    commit-message:
      prefix: chore(deps)
