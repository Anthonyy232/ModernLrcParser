name: pr

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # SDK from global.json; the .NET 10 runtime runs the net10.0 tests.
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ModernLrcParser.sln

      - name: Build
        run: dotnet build ModernLrcParser.sln -c Release --no-restore

      - name: Test
        run: dotnet test --solution ModernLrcParser.sln -c Release --no-build

      - name: Format
        if: runner.os == 'Linux'
        run: dotnet format ModernLrcParser.sln --verify-no-changes --no-restore

      - name: AOT publish + smoke
        shell: bash
        run: |
          for tfm in net10.0 net11.0; do
            dotnet publish tests/ModernLrc.Tests.Aot/ModernLrc.Tests.Aot.csproj -c Release -f $tfm -o aot-$tfm
            ./aot-$tfm/ModernLrc.Tests.Aot
          done
