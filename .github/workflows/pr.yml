name: pr

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ModernLrcParser.sln

      - name: Build
        run: dotnet build ModernLrcParser.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/ModernLrc.Tests/ModernLrc.Tests.csproj -c Release --no-build

      - name: AOT publish + smoke
        shell: bash
        run: |
          dotnet publish tests/ModernLrc.Tests.Aot/ModernLrc.Tests.Aot.csproj -c Release -o aot-publish
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./aot-publish/ModernLrc.Tests.Aot.exe
          else
            ./aot-publish/ModernLrc.Tests.Aot
          fi
