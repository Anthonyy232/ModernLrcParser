name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          # SDK from global.json; the .NET 10 runtime runs the net10.0 tests.
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ModernLrcParser.sln

      - name: Build
        run: dotnet build ModernLrcParser.sln -c Release --no-restore

      - name: Test
        run: dotnet test --solution ModernLrcParser.sln -c Release --no-build

      - name: AOT publish + smoke
        run: |
          for tfm in net10.0 net11.0; do
            dotnet publish tests/ModernLrc.Tests.Aot/ModernLrc.Tests.Aot.csproj -c Release -f $tfm -o aot-$tfm
            ./aot-$tfm/ModernLrc.Tests.Aot
          done

      - name: Pack
        run: dotnet pack src/ModernLrc/ModernLrc.csproj -c Release --no-build -o nupkg

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nupkg
          path: nupkg/*.nupkg

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nupkg
          path: nupkg

      # A pushed package can't be taken back, so stop before it if the release can't finish.
      - name: Check the tag matches the package and a draft release exists
        run: |
          test -f "nupkg/ModernLrc.${GITHUB_REF_NAME#v}.nupkg"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true

      # Trusted publishing: exchanges the job's OIDC token for a short-lived NuGet key.
      - name: NuGet login
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: Anthonyy232

      - name: Push to NuGet
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish the draft release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
