name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ModernLrcParser.sln

      - name: Build
        run: dotnet build ModernLrcParser.sln -c Release --no-restore

      - name: Test
        run: dotnet test --solution ModernLrcParser.sln -c Release --no-build

      - name: AOT publish + smoke
        run: |
          dotnet publish tests/ModernLrc.Tests.Aot/ModernLrc.Tests.Aot.csproj -c Release -o aot-publish
          ./aot-publish/ModernLrc.Tests.Aot

      - name: Pack
        run: dotnet pack src/ModernLrc/ModernLrc.csproj -c Release --no-build -o nupkg

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: nupkg/*.nupkg

      # Trusted publishing: exchanges the job's OIDC token for a short-lived NuGet key.
      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: Anthonyy232

      - name: Push to NuGet
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # The release is drafted by hand before the tag exists; the tag only has to publish it.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
