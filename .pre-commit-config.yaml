repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        entry: dotnet format ModernLrcParser.sln --verbosity minimal
        language: system
        pass_filenames: false
        files: \.(cs|csproj|props|sln|json|editorconfig)$
